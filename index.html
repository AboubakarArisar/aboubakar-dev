<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d0b0a" />
    <script>
      let savedTheme;
      try {
        savedTheme = localStorage.getItem("portfolio-theme");
      } catch (error) {
        console.warn("Theme preference could not be read; using dark mode.", error);
      }
      const initialTheme = savedTheme === "dark" || savedTheme === "light"
        ? savedTheme
        : "dark";
      document.documentElement.dataset.theme = initialTheme;
      document.querySelector('meta[name="theme-color"]').content = initialTheme === "dark" ? "#0d0b0a" : "#f2ede6";
    </script>
    <title>Abou Bakar | Portfolio</title>
    <meta
      name="description"
      content="Abou Bakar Arisar is a full-stack software engineer from Pakistan building web apps, browser games and community products, including CastleHub, Last Light and Typeverse."
    />
    <link rel="canonical" href="https://www.aboubakarisar.tech/" />

    <meta property="og:site_name" content="Abou Bakar Arisar" />
